services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autozap}
      POSTGRES_USER: ${POSTGRES_USER:-autozap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autozap}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autozap}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-autozap}:${POSTGRES_PASSWORD:-autozap}@db:5432/${POSTGRES_DB:-autozap}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
  static_data:

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <title>AutoZap ERP</title>
    <script>
      // Тема ставится до первой отрисовки, иначе при загрузке в тёмной теме
      // на долю секунды мигает белый экран.
      try {
        var t = localStorage.getItem('autozap_theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
